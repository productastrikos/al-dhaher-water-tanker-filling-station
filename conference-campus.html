<title>AMO Conference Digital Twin</title>
<style>

  :root {
    --ds-success: #16a34a;
    --ds-warning: #d97706;
    --ds-danger: #dc2626;
    --ds-text: #e8eef5;
    --ds-text-muted: #afc3d8;
    --ds-text-faint: #8ca0b6;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0a;
    color: #e8eef5;
    font-family: -apple-system, 'Segoe UI', Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 28px 20px 48px;
  }
  header { width: 100%; max-width: 1240px; }
  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  p  { margin: 0; font-size: 12px; color: #8ca0b6; max-width: 70ch; line-height: 1.55; }
  .frame {
    width: 100%;
    max-width: 1240px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    overflow: hidden;
    background: #04182c;
  }
  svg { display: block; width: 100%; height: auto; }
  /* Utility classes the canvas emits; interaction is inert in a static export. */
  .pointer-events-none { pointer-events: none; }
  .cursor-pointer { cursor: default; }
  .select-none { user-select: none; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
</style>
