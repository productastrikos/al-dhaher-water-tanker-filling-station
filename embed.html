<!DOCTYPE html>
<!--
  embed.html — AMO Conference Campus Digital Twin (iframe-optimised)
  ─────────────────────────────────────────────────────────────────
  This is a stripped-down, no-chrome version of the twin designed to be
  embedded in a dashboard via <iframe src="http://localhost:8000/embed.html">.

  It is identical to index.html but:
    • No header bar, no drawer panels, no nav buttons (clean iframe)
    • postMessage bridge is active — see digital-twin-api.js for full docs
    • Emits DT_READY when all GLB models finish loading
    • Responds to DT_FOCUS_ZONE, DT_SET_TELEMETRY, DT_SET_ALERT, DT_GET_ZONES

  Configure the GLB base URL:
    Pass ?assets=http://your-cdn.com/glb/ in the iframe src if your friend
    hosts the GLB files somewhere else. Default: same directory as this file.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AMO Conference Digital Twin — Embed</title>

  <!-- Three.js Import Map (CDN — no install needed) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04182c; }
    #canvas-container { width: 100%; height: 100%; }
    canvas { display: block; width: 100% !important; height: 100% !important; }

    /* Minimal toast for alerts inside the embed */
    #embed-toast {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #e8eef5; font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px; padding: 6px 16px; border-radius: 20px; pointer-events: none;
      opacity: 0; transition: opacity 0.3s; z-index: 999;
    }
    #embed-toast.show { opacity: 1; }

    /* Zone hover tooltip */
    #zone-tooltip {
      position: fixed; pointer-events: none; display: none;
      background: rgba(4, 24, 44, 0.9); border: 1px solid rgba(124,196,221,0.3);
      border-radius: 8px; padding: 8px 12px; font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8eef5; font-size: 12px; z-index: 100; backdrop-filter: blur(8px);
    }
    #zone-tooltip .tt-name { font-weight: 700; color: #7cc4dd; margin-bottom: 4px; }
    #zone-tooltip .tt-stat { color: #afc3d8; font-size: 11px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="embed-toast"></div>
  <div id="zone-tooltip">
    <div class="tt-name" id="tt-name"></div>
    <div class="tt-stat" id="tt-stat"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ── Config ──────────────────────────────────────────────────────
    // Optionally override GLB base URL with ?assets=<url> in the iframe src
    const params = new URLSearchParams(location.search);
    const ASSETS_BASE = params.get('assets') ?? './';

    const SVG_WIDTH = 1240, SVG_HEIGHT = 880, SCALE_FACTOR = 0.1;
    const toWorld = (x, y) => ({
      x: (x - SVG_WIDTH / 2) * SCALE_FACTOR,
      z: (y - SVG_HEIGHT / 2) * SCALE_FACTOR
    });

    // ── Campus Zones ────────────────────────────────────────────────
    const campusZones = [
      { id:'zone-conf-centre',  name:'Conference Centre',    type:'building', glbFile:'headquarters_building_office_building.glb', svgX:670,   svgY:230,   width:50, height:12, depth:28, color:0x24688a, telemetry:{ occupancy:'580 / 800', temp:'21.5°C', power:'210 kW', aqi:'14 (Good)' } },
      { id:'zone-exhib-hall',   name:'Exhibition Hall',      type:'building', glbFile:'free__atlanta_corperate_office_building.glb', svgX:225,  svgY:265,   width:24, height:10, depth:22, color:0x24688a, telemetry:{ occupancy:'840 / 1200', temp:'22.0°C', power:'340 kW', aqi:'19 (Good)' } },
      { id:'zone-main-plaza',   name:'Main Plaza',           type:'plaza',    glbFile:'plaza.glb',                                  svgX:670,   svgY:505,   width:26, height:0.6, depth:11, color:0x3a92b2, telemetry:{ occupancy:'310 / 500', temp:'Outdoor', power:'45 kW', aqi:'12 (Optimal)' } },
      { id:'zone-emerg-assembly',name:'Emergency Assembly',  type:'building', glbFile:'fd0fcff7053d4d9f8829320a30d7087e.glb',       svgX:202.5, svgY:510,   width:20, height:6,  depth:13, color:0x24688a, telemetry:{ occupancy:'0 / 400', temp:'23.1°C', power:'15 kW', aqi:'15 (Good)' } },
      { id:'zone-reg-area',     name:'Registration Area',    type:'building', glbFile:'office_building.glb',                        svgX:402.5, svgY:637.5, width:16, height:5,  depth:7,  color:0x24688a, telemetry:{ occupancy:'145 / 200', temp:'22.8°C', power:'28 kW', aqi:'16 (Good)' } },
      { id:'zone-info-desk',    name:'Information Desk',     type:'building', glbFile:'game_ready_building_3.glb',                  svgX:549,   svgY:637.5, width:11, height:5,  depth:7,  color:0x24688a, telemetry:{ occupancy:'35 / 50', temp:'22.5°C', power:'12 kW', aqi:'15 (Good)' } },
      { id:'zone-food-court',   name:'Food Court',           type:'building', glbFile:'restaurant_2.glb',                          svgX:1084,  svgY:215.5, width:14, height:8,  depth:12, color:0x24688a, telemetry:{ occupancy:'220 / 300', temp:'23.4°C', power:'115 kW', aqi:'22 (Moderate)' } },
      { id:'zone-med-centre',   name:'Medical Centre',       type:'building', glbFile:'hospital.glb',                              svgX:1084,  svgY:362,   width:14, height:7,  depth:11, color:0x24688a, telemetry:{ occupancy:'12 / 50', temp:'21.0°C', power:'48 kW', aqi:'10 (Cleanroom)' } },
      { id:'zone-parking-area', name:'Parking Area',         type:'parking',  glbFile:'parking_lot.glb',                          svgX:700,   svgY:790,   width:66, height:0.3, depth:12, color:0x1b5375, telemetry:{ occupancy:'184 / 250 vehicles', temp:'Ambient', power:'24 kW', aqi:'25' } },
    ];

    // ── Scene Setup ─────────────────────────────────────────────────
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04182c);
    scene.fog = new THREE.FogExp2(0x04182c, 0.012);

    const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 800);
    camera.position.set(0, 55, 65);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 8;
    controls.maxDistance = 200;

    // Lights
    scene.add(new THREE.AmbientLight(0xc8dff0, 0.55));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(30, 60, 40);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x99c8e0, 0x0d3a5f, 0.4));

    // Ground plane
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(180, 110),
      new THREE.MeshStandardMaterial({ color: 0x0d3a5f, roughness: 0.8, metalness: 0.1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ── Load GLBs ───────────────────────────────────────────────────
    const loader = new GLTFLoader();
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredZone = null, selectedZone = null;
    let loadedCount = 0;

    campusZones.forEach(zone => {
      const wp = toWorld(zone.svgX, zone.svgY);
      loader.load(
        ASSETS_BASE + zone.glbFile,
        (gltf) => {
          const mesh = gltf.scene;
          const box = new THREE.Box3().setFromObject(mesh);
          const size = box.getSize(new THREE.Vector3());
          const scaleX = zone.width / size.x;
          const scaleY = zone.height / size.y;
          const scaleZ = zone.depth / size.z;
          const scale = Math.min(scaleX, scaleY, scaleZ);
          mesh.scale.setScalar(scale);
          mesh.position.set(wp.x, 0, wp.z);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          mesh.userData.zoneId = zone.id;
          scene.add(mesh);
          zone.mesh = mesh;
          loadedCount++;
          if (loadedCount === campusZones.length) onAllLoaded();
        },
        undefined,
        () => {
          // Fallback box if GLB fails to load
          const fallback = new THREE.Mesh(
            new THREE.BoxGeometry(zone.width * 0.5, zone.height, zone.depth * 0.5),
            new THREE.MeshStandardMaterial({ color: zone.color, roughness: 0.4 })
          );
          fallback.position.set(wp.x, zone.height / 2, wp.z);
          fallback.userData.zoneId = zone.id;
          scene.add(fallback);
          zone.mesh = fallback;
          loadedCount++;
          if (loadedCount === campusZones.length) onAllLoaded();
        }
      );
    });

    function onAllLoaded() {
      emitToParent('DT_READY', {
        zones: campusZones.map(z => ({ id: z.id, name: z.name, type: z.type, telemetry: z.telemetry, alertLevel: z.alertLevel ?? 'normal' }))
      });
    }

    // ── Resize handler ───────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // ── Mouse interaction ────────────────────────────────────────────
    const tooltip = document.getElementById('zone-tooltip');
    const ttName = document.getElementById('tt-name');
    const ttStat = document.getElementById('tt-stat');

    renderer.domElement.addEventListener('mousemove', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width)  *  2 - 1;
      mouse.y = ((e.clientY - rect.top)  / rect.height) * -2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(scene.children, true);
      const zoneHit = hits.find(h => h.object.userData.zoneId || h.object.parent?.userData.zoneId);
      if (zoneHit) {
        const zid = zoneHit.object.userData.zoneId || zoneHit.object.parent?.userData.zoneId;
        const zone = campusZones.find(z => z.id === zid);
        if (zone && zone !== hoveredZone) {
          hoveredZone = zone;
          emitToParent('DT_ZONE_HOVER', { zone: zoneSnapshot(zone) });
        }
        ttName.textContent = zone?.name ?? '';
        ttStat.textContent = zone ? `Occupancy: ${zone.telemetry.occupancy} | Temp: ${zone.telemetry.temp}` : '';
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top  = (e.clientY - 8)  + 'px';
      } else {
        tooltip.style.display = 'none';
        hoveredZone = null;
      }
    });

    renderer.domElement.addEventListener('click', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width)  *  2 - 1;
      mouse.y = ((e.clientY - rect.top)  / rect.height) * -2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(scene.children, true);
      const zoneHit = hits.find(h => h.object.userData.zoneId || h.object.parent?.userData.zoneId);
      if (zoneHit) {
        const zid = zoneHit.object.userData.zoneId || zoneHit.object.parent?.userData.zoneId;
        const zone = campusZones.find(z => z.id === zid);
        if (zone) {
          selectedZone = zone;
          emitToParent('DT_ZONE_CLICK', { zone: zoneSnapshot(zone) });
        }
      }
    });

    // ── postMessage bridge ───────────────────────────────────────────
    function emitToParent(type, payload = {}) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type, ...payload }, '*');
      }
    }

    function zoneSnapshot(zone) {
      return { id: zone.id, name: zone.name, type: zone.type, telemetry: zone.telemetry, alertLevel: zone.alertLevel ?? 'normal' };
    }

    function focusOnZone(zone) {
      if (!zone.mesh) return;
      const box = new THREE.Box3().setFromObject(zone.mesh);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const dist = Math.max(size.x, size.z) * 2.5 + 10;
      camera.position.set(center.x + dist * 0.4, dist * 0.7, center.z + dist * 0.6);
      controls.target.copy(center);
      controls.update();
    }

    function resetCamera() {
      camera.position.set(0, 55, 65);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || typeof msg.type !== 'string' || !msg.type.startsWith('DT_')) return;

      switch (msg.type) {
        case 'DT_FOCUS_ZONE': {
          const zone = campusZones.find(z => z.id === msg.zoneId);
          if (zone) focusOnZone(zone);
          break;
        }
        case 'DT_SET_TELEMETRY': {
          const zone = campusZones.find(z => z.id === msg.zoneId);
          if (zone && msg.data) zone.telemetry = { ...zone.telemetry, ...msg.data };
          break;
        }
        case 'DT_SET_ALERT': {
          const zone = campusZones.find(z => z.id === msg.zoneId);
          if (zone?.mesh) {
            const colorMap = { normal: 0x000000, warning: 0xd97706, danger: 0xdc2626 };
            const col = colorMap[msg.level] ?? 0x000000;
            zone.mesh.traverse(child => {
              if (child.isMesh && child.material) {
                child.material.emissive?.setHex(col);
                child.material.emissiveIntensity = msg.level === 'normal' ? 0 : 0.45;
              }
            });
            zone.alertLevel = msg.level;
          }
          break;
        }
        case 'DT_GET_ZONES': {
          const payload = campusZones.map(zoneSnapshot);
          (event.source ?? window.parent)?.postMessage({ type: 'DT_ZONES_LIST', zones: payload }, '*');
          break;
        }
        case 'DT_RESET_VIEW': {
          resetCamera();
          break;
        }
      }
    });

    // ── Render loop ──────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
