<!doctype html><html><head><meta charset="utf-8"><title>smoke</title>
<style>body{margin:0;background:#0a1424;color:#fff;font:12px sans-serif} #c{width:100vw;height:100vh;display:block} .lbl{background:#0d1a30;border:1px solid #22d3ee;padding:3px 6px;border-radius:4px;color:#22d3ee;font-weight:700}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
</head><body><canvas id="c"></canvas><div id="labels" style="position:absolute;top:0;left:0;pointer-events:none"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
const canvas=document.getElementById('c');
const r=new THREE.WebGLRenderer({canvas,antialias:true}); r.setSize(innerWidth,innerHeight); r.setPixelRatio(devicePixelRatio);
const lr=new CSS2DRenderer({element:document.getElementById('labels')}); lr.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a1424);
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,500); cam.position.set(14,10,18);
const ctl=new OrbitControls(cam,canvas);
scene.add(new THREE.HemisphereLight(0xbfd8ff,0x223344,1.6)); const d=new THREE.DirectionalLight(0xffffff,2.2); d.position.set(10,20,8); scene.add(d);
scene.add(new THREE.GridHelper(40,40,0x1f3a5c,0x12243a));
const L=new GLTFLoader(); const files=['truck-tank-kolos.glb','water-tank-quaternius.glb','silo-quaternius.glb','security-camera.glb','traffic-barrier.glb','sump-pump.glb','building-l.glb','pipes-quaternius.glb'];
const status=[];
files.forEach((f,i)=>L.load('../assets/models/'+f,g=>{const o=g.scene; const b=new THREE.Box3().setFromObject(o); const s=b.getSize(new THREE.Vector3()); const k=4/Math.max(s.x,s.y,s.z); o.scale.setScalar(k); const b2=new THREE.Box3().setFromObject(o); o.position.set((i%4)*6-9,-b2.min.y,Math.floor(i/4)*7-3); scene.add(o); const el=document.createElement('div'); el.className='lbl'; el.textContent=f.replace('.glb',''); const lb=new CSS2DObject(el); lb.position.set(0,(b2.max.y-b2.min.y)+0.6,0); o.add(lb); status.push(f+' ok '+s.x.toFixed(1)+'x'+s.y.toFixed(1)+'x'+s.z.toFixed(1)); window.__status=status;},undefined,e=>{status.push(f+' ERR '+e.message); window.__status=status;}));
// procedural pipe with animated flow
const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(-12,0.8,8),new THREE.Vector3(-4,0.8,8),new THREE.Vector3(0,0.8,6),new THREE.Vector3(8,0.8,6),new THREE.Vector3(12,0.8,8)]);
const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,80,0.25,12,false),new THREE.MeshStandardMaterial({color:0x8fa3c2,metalness:0.6,roughness:0.35})); scene.add(tube);
const cv=document.createElement('canvas'); cv.width=64; cv.height=8; const cx=cv.getContext('2d'); cx.fillStyle='#000'; cx.fillRect(0,0,64,8); cx.fillStyle='#22d3ee'; cx.fillRect(0,0,24,8);
const tex=new THREE.CanvasTexture(cv); tex.wrapS=THREE.RepeatWrapping; tex.repeat.set(30,1);
const flow=new THREE.Mesh(new THREE.TubeGeometry(curve,80,0.12,10,false),new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.95})); scene.add(flow);
function loop(t){tex.offset.x=-t*0.0006; ctl.update(); r.render(scene,cam); lr.render(scene,cam); requestAnimationFrame(loop);} requestAnimationFrame(loop);
</script></body></html>
